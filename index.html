<style>
:root{--bg:#000;--pn:#050805;--g:#00ff41;--gd:#00b82e;--gx:#0a5a1c;--r:#ff2a2a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000}
body{color:var(--g);font-family:"JetBrains Mono","Courier New",ui-monospace,Menlo,monospace;font-size:16px;line-height:1.45}
body.normal{--g:#38bdf8;--gd:#2a9ccc;--gx:#0b3b52}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,255,65,.03) 0 1px,transparent 1px 3px);z-index:50}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.26;pointer-events:none}
header,nav,main{position:relative;z-index:1}
#fps{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);right:8px;z-index:60;font-size:.9rem;border:1px solid var(--gx);background:#000;padding:2px 8px;text-shadow:0 0 6px var(--g)}
header{padding:14px 14px 10px;border-bottom:1px solid var(--gx)}
.top{display:flex;align-items:center;gap:12px}

.brand span{color:var(--gd);display:block;font-size:1.05rem;letter-spacing:9px;margin-top:2px}
.prompt{font-size:.9rem;color:var(--gd);margin-top:6px}
.cur{display:inline-block;width:8px;height:1em;background:var(--g);vertical-align:-2px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.sub{color:var(--gd);font-size:.9rem;margin-top:10px}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn,.row select{border:0;background:var(--g);color:#000;font:inherit;font-weight:700;font-size:.9rem;padding:9px 12px;cursor:pointer}
.row select{background:#000;color:var(--g);border:1px solid var(--g)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;gap:0;padding:0 0 env(safe-area-inset-bottom,0px);background:#000;border-top:1px solid var(--g);box-shadow:0 -4px 18px rgba(0,255,65,.18);overflow-x:auto}
@keyframes f{from{opacity:0;transform:translateY(6px)}}
.view.on{animation:f .25s ease}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button{flex:1 0 auto;min-width:54px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;background:#000;border:0;border-top:2px solid transparent;color:var(--gd);font:inherit;font-size:.66rem;cursor:pointer}
nav button.on{color:var(--g);border-top-color:var(--g);background:rgba(0,255,65,.08);text-shadow:0 0 8px var(--g);font-weight:700}
main{max-width:560px;margin:0 auto;padding:14px 14px 96px}
.view{display:none}.view.on{display:block}
.mode{display:flex;gap:6px;margin-bottom:6px}
.mode button{flex:1;padding:11px 4px;background:#000;border:1px solid var(--gx);color:var(--gd);font:inherit;font-size:.9rem;cursor:pointer}
.mode button.on{border-color:var(--g);color:var(--g);box-shadow:0 0 10px var(--g)}
.hero{text-align:center;margin:5vh 0 16px}
.hero .t{font-family:Orbitron,"JetBrains Mono",sans-serif;font-size:2.2rem;font-weight:800;text-shadow:0 0 14px var(--g)}
.hero p{color:var(--gd);margin:6px 0 0;font-size:.95rem}
.bar{display:flex;border:1px solid var(--g);box-shadow:0 0 14px rgba(0,255,65,.3);background:#000}
.bar span{padding:15px 0 0 10px}
.bar input{flex:1;min-width:0;border:0;background:transparent;color:var(--g);font:inherit;font-size:1.15rem;padding:14px 8px;outline:0;caret-color:var(--g)}
.bar input::placeholder{color:var(--gx)}
.bar button{border:0;background:var(--g);color:#000;font:inherit;font-weight:700;padding:0 16px;cursor:pointer}
.eng{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0}
.eng label{cursor:pointer}.eng input{display:none}
.eng span{display:inline-block;padding:8px 12px;border:1px solid var(--gx);color:var(--gd);font-size:.92rem}
.eng input:checked+span{border-color:var(--g);color:var(--g);box-shadow:0 0 8px rgba(0,255,65,.4)}
.card{border:1px solid var(--gx);background:var(--pn);padding:13px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:1.05rem;letter-spacing:.5px}
.card p{margin:0 0 10px;color:var(--gd);font-size:.92rem}
.card a{display:inline-block;padding:9px 14px;border:1px solid var(--g);color:var(--g);text-decoration:none;font-size:.92rem}
.warn{border-color:var(--r)}.warn h3{color:var(--r)}.warn p{color:#ff8a8a;margin:0}
textarea,.card input[type=text]{width:100%;background:#000;border:1px solid var(--gx);color:var(--g);font:inherit;padding:8px;margin-bottom:6px;outline:0}
.out{word-break:break-all;border:1px dashed var(--gx);padding:8px;min-height:40px;font-size:.95rem;margin:6px 0}
input[type=range]{width:100%;accent-color:var(--g)}
.hint{color:var(--gd);font-size:.85rem;text-align:center}
.rc{background:#000;border:1px solid var(--gx);color:var(--gd);font:inherit;font-size:.88rem;margin:3px;padding:6px 10px;cursor:pointer}
#notepad{min-height:220px}
body.noscan::after{display:none}
#gate{position:fixed;inset:0;z-index:200;background:#000;display:flex;justify-content:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 24px}
.gbox{width:100%;max-width:420px;margin:auto;text-align:center}
#glogo svg{width:160px;height:160px;filter:drop-shadow(0 0 14px var(--g));margin-bottom:14px}
#gate input[type=password]{width:100%;background:#000;border:1px solid var(--g);color:var(--g);font:inherit;font-size:1.15rem;padding:13px;margin-bottom:8px;outline:0;text-align:center;letter-spacing:3px}
#gate .card{text-align:left;margin-top:14px}
#gate select{margin:12px 0 8px;background:#000;color:var(--g);border:1px solid var(--g);font:inherit;padding:8px}
.btn2{margin:4px 6px 0 0}
</style>
</head>

b.classList.add('on');$(b.dataset.v).classList.add('on')})});
/* search */
var sc={'!d':'https://duckduckgo.com/?q=','!s':'https://www.startpage.com/do/search?q=','!b':'https://search.brave.com/search?q=','!m':'https://www.mojeek.com/search?q=','!g':'https://www.google.com/search?q=','!y':'https://yandex.com/search/?text='};
function go(){var q=$('q').value.trim();if(!q)return;
var base=document.querySelector(mode==='g'?'input[name=e]:checked':'input[name=n]:checked').value,p=q.slice(0,2).toLowerCase();
if(sc[p]&&q.charAt(2)===' '){base=sc[p];q=q.slice(3).trim();if(!q)return}
var a=document.createElement('a');a.href=base+encodeURIComponent(q);a.target='_blank';a.rel='noopener noreferrer';
document.body.appendChild(a);a.click();a.remove();$('q').value='';nsearch++;if(mode==='n')addRecent(q)}
$('go').addEventListener('click',go);
$('q').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
/* panic */
$('panic').addEventListener('click',function(){document.querySelectorAll('textarea,input[type=text]').forEach(function(e){e.value=''});$('pout').textContent='-';try{location.replace('about:blank')}catch(e){document.body.innerHTML=''}});
/* matrix rain */
var cv=$('rain'),cx=cv.getContext('2d'),cols=0,drops=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.floor(cv.width/16);drops=[];for(var i=0;i<cols;i++)drops[i]=Math.random()*-50}
rs();addEventListener('resize',rs);
var ch='01アイウエオカキクケコ{}<>/$#';
function rain(){if(on){cx.fillStyle='rgba(0,0,0,.08)';cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle='#00ff41';cx.font='14px monospace';for(var i=0;i<cols;i++){cx.fillText(ch[Math.floor(Math.random()*ch.length)],i*16,drops[i]*16);if(drops[i]*16>cv.height&&Math.random()>.975)drops[i]=0;drops[i]++}}setTimeout(rain,rdelay)}
rain();
$('rainbtn').addEventListener('click',function(){on=!on;if(!on)cx.clearRect(0,0,cv.width,cv.height);this.textContent=on?T('rg'):T('rk')});
/* password */
var cs='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*-_=+?';
function gen(){var n=+$('plen').value,a=new Uint32Array(n),lim=Math.floor(4294967296/cs.length)*cs.length,s='';
while(s.length<n){crypto.getRandomValues(a);for(var i=0;i<n&&s.length<n;i++){if(a[i]<lim)s+=cs[a[i]%cs.length]}}
$('pout').textContent=s}
$('plen').addEventListener('input',function(){$('plabel').textContent=T('len')+': '+this.value;gen()});
$('pgen').addEventListener('click',gen);gen();
$('pcopy').addEventListener('click',function(){var b=this;try{navigator.clipboard.writeText($('pout').textContent).then(function(){b.textContent=T('cpd');setTimeout(function(){b.textContent=T('cp')},1500)},function(){})}catch(e){}});
/* hash */
$('hgo').addEventListener('click',function(){crypto.subtle.digest('SHA-256',new TextEncoder().encode($('hin').value)).then(function(h){$('hout').textContent=Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0')}).join('')},function(){$('hout').textContent=T('eb')})});
/* base64 */
$('benc').addEventListener('click',function(){try{var s='';new TextEncoder().encode($('bin').value).forEach(function(c){s+=String.fromCharCode(c)});$('bout').textContent=btoa(s)}catch(e){$('bout').textContent=T('eb')}});
$('bdec').addEventListener('click',function(){try{var s=atob($('bin').value.trim()),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);$('bout').textContent=new TextDecoder().decode(u)}catch(e){$('bout').textContent=T('e64')}});
/* link cleaner */
$('lgo').addEventListener('click',function(){var v=$('lin').value.trim();try{var u=new URL(v),rm=[];u.searchParams.forEach(function(_,k){if(/^(utm_|fbclid|gclid|dclid|msclkid|mc_|igshid|yclid|_ga|ref_src|si$)/i.test(k))rm.push(k)});rm.forEach(function(k){u.searchParams.delete(k)});$('lout').textContent=u.toString()}catch(e){$('lout').textContent=T('el')}});
/* username */
var w1=['shadow','ghost','cipher','null','void','echo','proxy','rogue','static','zero'],w2=['fox','wolf','node','byte','root','raven','pixel','vector','kernel','signal'];
$('ugo').addEventListener('click',function(){var r=new Uint32Array(3);crypto.getRandomValues(r);$('uout').textContent=w1[r[0]%10]+'_'+w2[r[1]%10]+(r[2]%9000+1000)});
$('nclr').addEventListener('click',function(){$('notepad').value=''});
/* code / admin (hash compare, code is not stored in plain text) */
var AH="22cb521fc712bd3c86ba8c27c2b942b0ac24d9c33ce285922b8712b8425bb64e";
function sysinfo(){$('asys').textContent=screen.width+'x'+screen.height+' · '+(navigator.language||'-')+' · '+(navigator.onLine?'online':'offline')+' · '+(navigator.platform||'-')}
function hx(b){return Array.from(new Uint8Array(b)).map(function(c){return c.toString(16).padStart(2,'0')}).join('')}
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(hx)}
function lsG(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsS(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function showView(id){document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('on',x.dataset.v===id)});document.querySelectorAll('.view').forEach(function(x){x.classList.toggle('on',x.id===id)})}
function enter(isAdm){$('gate').style.display='none';admin=!!isAdm;$('admtab').style.display=admin?'':'none';if(admin)sysinfo();setMode(mode)}
function lockApp(){admin=false;$('admtab').style.display='none';showView('search');$('gate').style.display='flex';$('gmsg').textContent='';setMode(mode)}
function login(){var v=$('gcode').value;$('gcode').value='';if(!v)return;
sha(v).then(function(x){if(x===AH){enter(true);return}
var s=lsG('pi_s'),h=lsG('pi_h');if(!s||!h){$('gmsg').textContent=T('g_err');return}
sha(s+v).then(function(y){if(y===h)enter(false);else $('gmsg').textContent=T('g_err')})})}
function mk(){var v=$('ncode').value;if(v.length<4){$('gmsg').textContent=T('g_short');return}$('ncode').value='';
var a=new Uint8Array(16);crypto.getRandomValues(a);var s=hx(a);
sha(s+v).then(function(h){lsS('pi_s',s);lsS('pi_h',h);$('gmsg').textContent=T('g_saved');setTimeout(function(){enter(false)},500)})}
$('gbtn').addEventListener('click',login);
$('gcode').addEventListener('keydown',function(e){if(e.key==='Enter')login()});
$('gnew').addEventListener('click',mk);
$('ncode').addEventListener('keydown',function(e){if(e.key==='Enter')mk()});
$('lockbtn').addEventListener('click',lockApp);
$('lang2').addEventListener('change',function(){lang=this.value;$('lang').value=lang;apply()});
$('glogo').innerHTML=document.querySelector('header svg').outerHTML;
setInterval(function(){if(admin){$('ast').textContent=nsearch;$('aup').textContent=Math.floor((Date.now()-t0)/1000)}},1000);
$('tfps').addEventListener('click',function(){var f=$('fps');f.style.display=f.style.display==='none'?'':'none'});
var sl=true;$('tscan').addEventListener('click',function(){sl=!sl;document.body.classList.toggle('noscan',!sl)});
$('tspd').addEventListener('click',function(){rdelay=rdelay===60?25:60});
$('alock').addEventListener('click',lockApp);
apply();
if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
